
<div id="gambling-screen">

    <div class="pool-container">
        @for(resultPool of poolsResults(); track $index; let i = $index){
            <app-gambling-pool 
                [charactersWheel]="charactersWheel()[i]"
                [resultPool]="resultPool"
                [(isSpinning)]="isSpinning()[i]"
                [spinningTime]="(i+1) / poolsResults().length * timeFullSpin()"
                [dataIndexWheel]="i"
            ></app-gambling-pool>
        }
    </div>

</div>
