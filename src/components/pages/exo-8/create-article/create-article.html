

<div class="form-create-article-container">

    <h3>create article (NgModel)</h3>

    <div class="input-line">
        <label for="name-article">name :</label>
        <input type="text" id="name-article" name="name-article" [(ngModel)]="nameArticle"/>
    </div>
    <div class="input-line">
        <label for="price-article">prix :</label>
        <input type="number" id="price-article" name="price-article" [(ngModel)]="priceArticle"/>
    </div>
    <div class="input-line">
        <label for="quantity-article">quantité :</label>
        <input type="number" id="price-article" name="price-article"[(ngModel)]="quantityArticle"/>
    </div>

    <div class="input-line submit-line">
        <button (click)="createArticle()">Ajout</button>
    </div>

</div>
